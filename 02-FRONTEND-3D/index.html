<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telaio 2D — prototipo</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #eef0f3; --panel: #ffffff; --ink: #1d232b; --muted: #5d6673; --line: #d5d9df;
    --accent: #2f5fa7; --accent-ink: #ffffff; --warn: #a23b2a; --ok: #2d7a46;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 8px 0 0; }
  .gruppo { display: flex; gap: 6px; align-items: center; }
  select, button, input[type=number] { font: inherit; padding: 4px 8px; border: 1px solid var(--line);
           border-radius: 6px; background: #fff; color: var(--ink); }
  button { cursor: pointer; }
  button.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.attivo { background: #dfe7f4; border-color: var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label.spunta { display: flex; gap: 4px; align-items: center; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #vista { position: relative; min-width: 0; min-height: 0; }
  #vista canvas { display: block; }
  #legenda { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,0.9); border: 1px solid var(--line);
             border-radius: 6px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
  .strato-etichette { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .etichetta { position: absolute; left: 0; top: 0; font: 11px/1 var(--mono); padding: 2px 4px; border-radius: 3px;
               background: rgba(255,255,255,0.85); color: var(--ink); white-space: nowrap; }
  #stato { position: absolute; left: 10px; top: 10px; font-size: 12px; padding: 4px 8px; border-radius: 6px;
           background: rgba(255,255,255,0.9); border: 1px solid var(--line); }
  #stato.errore { color: var(--warn); border-color: var(--warn); }
  #stato.ok { color: var(--ok); }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td, th { padding: 3px 4px; border-bottom: 1px solid #eef0f3; text-align: left; vertical-align: top; }
  td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .vuoto { color: var(--muted); font-style: italic; }
  .riga-campo { display: grid; grid-template-columns: 110px 1fr; gap: 6px; align-items: center; margin: 4px 0; }
  .riga-campo input[type=number] { width: 100%; }
  .nota { font-size: 12px; color: var(--muted); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<header>
  <h1>Telaio 2D · prototipo</h1>
  <div class="gruppo">
    <select id="sel-caso" aria-label="Modello"></select>
    <button id="btn-nuovo">Nuovo</button>
    <label class="gruppo nota">o file <input type="file" id="file-modello" accept=".json"></label>
  </div>
  <div class="gruppo">
    <select id="sel-carico" aria-label="Caso di carico"></select>
    <button class="primario" id="btn-calcola">Calcola</button>
  </div>
  <div class="gruppo" role="group" aria-label="Disegno">
    <button id="btn-disegna" title="Clic sulla vista: nodo iniziale, poi nodi successivi; Esc per chiudere la spezzata">Disegna aste</button>
    <label class="gruppo nota">passo <input type="number" id="passo" value="0.5" min="0.01" step="any" style="width:4.5em" aria-label="Passo della griglia [m]"> m</label>
  </div>
  <div class="gruppo" role="group" aria-label="Vista">
    <button data-vista="frontale" class="attivo">Frontale</button>
    <button data-vista="alto">Dall'alto</button>
    <button data-vista="asso">Assonometrica</button>
  </div>
  <div class="gruppo" role="group" aria-label="Risultati">
    <label class="spunta"><input type="checkbox" id="chk-def" checked> deformata</label>
    <label class="spunta"><input type="radio" name="diag" value="M" checked> M</label>
    <label class="spunta"><input type="radio" name="diag" value="V"> V</label>
    <label class="spunta"><input type="radio" name="diag" value="N"> N</label>
    <label class="spunta"><input type="radio" name="diag" value=""> nessuno</label>
  </div>
</header>
<main>
  <div id="vista">
    <div id="stato">Avvio...</div>
    <div id="legenda">Clic su un'asta o un nodo per le proprietà · trascina per ruotare (assonometrica), rotella per lo zoom</div>
  </div>
  <aside>
    <h2>Modifica del modello</h2>
    <div id="pannello-modifica"></div>
    <h2>Proprietà</h2>
    <div id="pannello-proprieta"><p class="vuoto">Nessun elemento selezionato.</p></div>
    <h2>Risultati principali</h2>
    <div id="pannello-risultati"><p class="vuoto">Premi «Calcola».</p></div>
  </aside>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
